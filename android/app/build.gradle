  plugins {id 'com.android.application' version "8.4.0"
           id 'com.google.gms.google-services' version "4.3.1"
           }
  project.ext.react = [ hermesEnabled: true, newArchEnabled: true,
 hermesCommandFlags:["--source-maps"] 
]
  import java.util.Properties
  import java.io.FileInputStream
  def keystoreProperties = new Properties()
  def keystorePropertiesFile = rootProject.file("keystore.properties")
  if (keystorePropertiesFile.exists())
  {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
  }
       android{
    namespace "com.sahojogita.social"
    compileSdkVersion 34
 defaultConfig{
         applicationId "com.sahojogita.social"
         minSdkVersion 24
        targetSdkVersion 34
     versionCode 2
        versionName "1.0"
        multiDexEnabled true
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "true"
        buildConfigField "boolean", "IS_HERMES_ENABLED", "true"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                targets "MyAppModules"
                cppFlags "-frtti -fexceptions -std=c++17"
            }
        }
        ndk{
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs{
        release{
            storeFile file(keystoreProperties["storeFile"])
        storePassword keystoreProperties["storePassword"]
        keyAlias keystoreProperties["keyAlias"]
        keyPassword keystoreProperties["keyPassword"]
    }
 }
    buildTypes{
        debug{
            debuggable true
            buildConfigField "boolean", "DEBUG", "true"
        }
        release{
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles
getDefaultProguardFile("proguard-android-optimize.txt") 
      "proguard-rules.pro"
            }
}
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        prefab true
    }
    packagingOptions {
        pickFirst '**/*.so'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
    }
    sourceSets {
        main{
            java.srcDirs = ["src/main/java"]
            assets.srcDirs= ["src/main/assets"]
            res.srcDirs= ["src/main/res"]
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
}
dependencies{
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'com.facebook.react:react-android:0.76.6'
    implementation 'com.facebook.react:hermes-android:0.76.6'
    implementation 'com.facebook.fresco:fresco:2.6.0'
    implementation 'com.facebook.fresco:animated-gif:2.6.0'
    implementation 'com.facebook.fresco:animated-webp:2.6.0'
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.android.gms:play-services-ads:22.5.0'
    implementation 'com.google.android.gms:play-services-base:18.2.0'
    implementation 'com.google.android.gms:play-services-recaptcha:17.1.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    }
    
  
  




