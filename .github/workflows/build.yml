name: Build Android APK
  
on:
 push:
  branches: 
    - main
 workflow_dispatch:

jobs:
 build:
  runs-on: ubuntu-latest

  steps:
   - name: Checkout repository
     uses: actions/checkout@v4
   
   - name: Setup Node.js
     uses: actions/setup-node@v4
     with:
      node-version: 20
   
   - name: Setup Java 
     uses: actions/setup-java@v3
     with: 
       distribution: 'temurin'
       java-version: 17
   
   - name: Setup Android SDK
     uses: android-actions/setup-android@v3

   - name: Install dependencies
     run: npm install
  
   - name: Generate Hermes + newArch bundle
     run: node generateBundle.js

   - name: Make gradlew executable
     run: chmod +x ./gradlew

   - name: Setup keystore
     run: |
        echo "storeFile=release.keystore" >> keystore.properties
        echo "storePassword=$RELEASE_KEYSTORE_PASSWORD" >> keystore.properties
        echo "keyAlias=$RELEASE_KEY_ALIAS" >> keystore.properties
        echo "keyPassword=$RELEASE_KEY_PASSWORD" >> keystore.properties

   - name: Decode keystore
     run: |
        echo "Decoding Base64 keystore..."
        mkdir -p $GITHUB_WORKSPACE/android/app
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -di > $GITHUB_WORKSPACE/android/app/release.keystore
        ls -lh $GITHUB_WORKSPACE/android/app/release.keystore
        keytool -list -v \ 
        -keystore $GITHUB_WORKSPACE/android/app/release.keystore \
        -storepass "${{ RELEASE_KEYSTORE_PASSWORD }}" 
     shell: bash

   - name: Setup google-services.json
     run: |
       echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
        
   - name: Build Release APK 
     run: ./gradlew assembleRelease 

   - name: Upload APK artifact
     uses: actions/upload-artifact@v4
     with:
       name: app-release
       path: android/app/build/outputs/apk/release/app-release.apk

