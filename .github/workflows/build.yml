name: Build Android APK
  
on:
 push:
  branches: 
    - main
 workflow_dispatch:

jobs:
 build:
  runs-on: ubuntu-latest

  steps:
   - name: Checkout repository
     uses: actions/checkout@v4
   
   - name: Setup Node.js
     uses: actions/setup-node@v4
     with:
      node-version: 20
   
   - name: Setup Java 
     uses: actions/setup-java@v4
     with: 
       distribution: 'temurin'
       java-version: 17
   
   - name: Setup Android SDK
     uses: android-actions/setup-android@v3

   - name: Install dependencies
     run: npm install
  
   - name: Generate Hermes + newArch bundle
     run: node generateBundle.js

   - name: Make gradlew executable
     run: chmod +x ./gradlew

   - name: Setup keystore
     run: |
        cd $GITHUB_WORKSPACE

        mkdir -p android/app

        cat > keystore.properties <<EOL storeFile=android/app/release.keystore
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }} EOL

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

        ls -l
        ls -l android/app
        echo "=== keystore.properties ==="
        cat keystore.properties
        
   - name: Build Release APK 
     run: ./gradlew assembleRelease 

   - name: Upload APK artifact
     uses: actions/upload-artifact@v4
     with:
       name: app-release
       path: android/app/build/outputs/apk/release/app-release.apk

